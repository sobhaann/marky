services:
  db:
    image: postgres:18.4-alpine3.24
    volumes:
      - db_data:/var/lib/postgresql
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: marky_super_user
      POSTGRES_DB: marky
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - 5050:5432

secrets:
  db_password:
    file: db_password.txt

volumes:
  db_data:
